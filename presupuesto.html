<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuestar OT - TallerPRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="shortcut icon" href="#">
    <style>
        :root { --bg-body: #090d16; --bg-card: #131c2e; --bg-input: #1a263d; --border-color: #24344d; --accent-orange: #ff5722; }
        body { background-color: var(--bg-body); color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
        .sidebar { width: 240px; height: 100vh; background-color: #0b111e; border-right: 1px solid var(--border-color); position: fixed; top: 0; left: 0; }
        .main-content { margin-left: 240px; padding: 30px; }
        @media (max-width: 768px) { .sidebar { margin-left: -240px; } .main-content { margin-left: 0; padding: 15px; } }
        .card-panel { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; }
        .form-control { background-color: var(--bg-input); border: 1px solid var(--border-color); color: #fff; }
    </style>
</head>
<body>

    <div class="sidebar d-flex flex-column justify-content-between py-3" id="sidebar">
        <div>
            <div class="px-4 mb-4"><span class="fs-4 fw-bold text-white">TALLER<span class="text-danger">PRO</span></span></div>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="ordenes.html" class="nav-link text-white"><i class="bi bi-arrow-left me-2"></i> Volver a Órdenes</a></li>
            </ul>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold m-0" id="tituloOT">Cargando Orden...</h3>
                <p class="text-secondary small m-0" id="subtituloOT">Ingreso de ítems y cotización de mano de obra</p>
            </div>
        </div>

        <div class="card-panel mb-4" id="infoClienteCard">
            <!-- Datos del auto cargados dinámicamente -->
        </div>

        <!-- FORMULARIO DE ÍTEMS -->
        <div class="card-panel">
            <h5 class="fw-bold text-danger mb-3"><i class="bi bi-list-check me-2"></i> Detalle de Trabajos y Repuestos</h5>
            
            <div class="row g-2 mb-3">
                <div class="col-12 col-md-6">
                    <input type="text" id="itemDesc" class="form-control" placeholder="Descripción del trabajo o repuesto (ej: Cambio Pastillas)">
                </div>
                <div class="col-6 col-md-2">
                    <input type="number" id="itemCant" class="form-control" value="1" min="1" placeholder="Cant.">
                </div>
                <div class="col-6 col-md-2">
                    <input type="number" id="itemPrecio" class="form-control" placeholder="Precio ($)">
                </div>
                <div class="col-12 col-md-2">
                    <button class="btn btn-danger w-100 fw-bold" onclick="agregarItem()"><i class="bi bi-plus-lg me-1"></i> Agregar</button>
                </div>
            </div>

            <div class="table-responsive mb-3">
                <table class="table table-dark align-middle">
                    <thead>
                        <tr class="text-secondary small">
                            <th>DESCRIPCIÓN</th>
                            <th class="text-center">CANT.</th>
                            <th class="text-end">P. UNITARIO</th>
                            <th class="text-end">SUBTOTAL</th>
                            <th class="text-center">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="bodyItems">
                        <tr><td colspan="5" class="text-center text-secondary py-3">No hay ítems agregados al presupuesto.</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center border-top border-secondary pt-3">
                <h4 class="m-0 fw-bold">Total Presupuesto: <span id="totalMonto" class="text-success">$0</span></h4>
                <button class="btn btn-success fw-bold px-4 py-2" id="btnGuardarPpto" onclick="guardarPresupuestoBD()">
                    <i class="bi bi-check-circle me-1"></i> Guardar Presupuesto
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>

    <script>
        let ordenActual = null;
        let itemsPresupuesto = [];

        document.addEventListener("DOMContentLoaded", async () => {
            if (typeof checkAuth === 'function') await checkAuth();
            
            const params = new URLSearchParams(window.location.search);
            const folio = params.get('ot');

            if (folio) {
                cargarOT(folio);
            } else {
                alert("No se especificó un folio de orden.");
                window.location.href = 'ordenes.html';
            }
        });

        async function cargarOT(folio) {
            const db = initSupabase();
            const { data, error } = await db.from('ordenes_trabajo').select('*').eq('numero', folio).single();

            if (error || !data) {
                alert("No se encontró la orden especificada.");
                window.location.href = 'ordenes.html';
                return;
            }

            ordenActual = data;
            itemsPresupuesto = Array.isArray(data.items) ? data.items : [];

            document.getElementById('tituloOT').innerText = `Presupuestar Folio ${data.numero}`;
            document.getElementById('infoClienteCard').innerHTML = `
                <div class="row text-white">
                    <div class="col-12 col-md-3"><strong>Cliente:</strong> ${data.cliente}</div>
                    <div class="col-12 col-md-3"><strong>Patente:</strong> <span class="badge bg-danger">${data.patente}</span></div>
                    <div class="col-12 col-md-3"><strong>Vehículo:</strong> ${data.vehiculo}</div>
                    <div class="col-12 col-md-3"><strong>Fecha Ingreso:</strong> ${data.fecha}</div>
                </div>
            `;

            renderizarItems();
        }

        function agregarItem() {
            const desc = document.getElementById('itemDesc').value.trim();
            const cant = parseInt(document.getElementById('itemCant').value) || 1;
            const precio = parseFloat(document.getElementById('itemPrecio').value) || 0;

            if (!desc || precio <= 0) {
                alert("Ingresa una descripción y precio válidos.");
                return;
            }

            itemsPresupuesto.push({ descripcion: desc, cantidad: cant, precio: precio, subtotal: cant * precio });
            
            document.getElementById('itemDesc').value = '';
            document.getElementById('itemCant').value = '1';
            document.getElementById('itemPrecio').value = '';

            renderizarItems();
        }

        function eliminarItem(index) {
            itemsPresupuesto.splice(index, 1);
            renderizarItems();
        }

        function renderizarItems() {
            const body = document.getElementById('bodyItems');
            body.innerHTML = '';

            let total = 0;

            if (itemsPresupuesto.length === 0) {
                body.innerHTML = '<tr><td colspan="5" class="text-center text-secondary py-3">No hay ítems agregados al presupuesto.</td></tr>';
            } else {
                itemsPresupuesto.forEach((item, index) => {
                    total += item.subtotal;
                    const pUnit = new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP' }).format(item.precio);
                    const subT = new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP' }).format(item.subtotal);

                    body.innerHTML += `
                        <tr>
                            <td>${item.descripcion}</td>
                            <td class="text-center">${item.cantidad}</td>
                            <td class="text-end">${pUnit}</td>
                            <td class="text-end fw-bold text-success">${subT}</td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-danger" onclick="eliminarItem(${index})"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            }

            document.getElementById('totalMonto').innerText = new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP' }).format(total);
        }

        async function guardarPresupuestoBD() {
            if (!ordenActual) return;

            const btn = document.getElementById('btnGuardarPpto');
            btn.disabled = true;
            btn.innerText = 'Guardando...';

            const totalSumado = itemsPresupuesto.reduce((acc, i) => acc + i.subtotal, 0);

            try {
                const db = initSupabase();
                const { error } = await db
                    .from('ordenes_trabajo')
                    .update({
                        items: itemsPresupuesto,
                        total: totalSumado,
                        estado: 'Presupuestado'
                    })
                    .eq('numero', ordenActual.numero);

                if (error) throw error;

                alert("¡Presupuesto guardado con éxito!");
                window.location.href = 'ordenes.html';

            } catch (err) {
                alert("Error al guardar presupuesto: " + err.message);
                btn.disabled = false;
                btn.innerText = 'Guardar Presupuesto';
            }
        }
    </script>
</body>
</html>
