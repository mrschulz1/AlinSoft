<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Recepción - TallerPRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --sidebar-bg: #0b1120;
            --main-bg: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --accent-orange: #ff5722;
        }

        body { background-color: var(--main-bg); color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }

        .sidebar { width: 220px; height: 100vh; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); position: fixed; top: 0; left: 0; z-index: 1000; transition: all 0.3s; }
        .main-content { margin-left: 220px; padding: 20px; transition: all 0.3s; }

        @media (max-width: 768px) {
            .sidebar { margin-left: -220px; }
            .sidebar.show { margin-left: 0; }
            .main-content { margin-left: 0; padding: 15px; }
        }

        .sidebar .nav-link { color: #94a3b8; padding: 10px 16px; font-size: 0.85rem; border-radius: 6px; margin: 2px 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #ffffff; background-color: #1e293b; }
        
        .card-custom { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; }
        .btn-orange { background-color: var(--accent-orange); color: #fff; font-weight: 600; }
        .btn-orange:hover { background-color: #e64a19; color: #fff; }
    </style>
</head>
<body>

    <!-- Header Móvil -->
    <div class="d-md-none p-3 bg-dark border-bottom border-secondary d-flex justify-content-between align-items-center">
        <span class="fw-bold fs-5 text-white">TALLER<span class="text-danger">PRO</span></span>
        <button class="btn btn-outline-light btn-sm" onclick="toggleSidebar()"><i class="bi bi-list fs-5"></i></button>
    </div>

    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column justify-content-between p-2" id="sidebar">
        <div>
            <div class="d-flex align-items-center px-3 py-3 mb-2">
                <i class="bi bi-gear-wide-connected text-danger fs-3 me-2"></i>
                <span class="fs-4 fw-bold">TALLER<span class="text-danger">PRO</span></span>
            </div>
            <ul class="nav nav-pills flex-column">
                <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-house-door me-2"></i> Inicio</a></li>
                <li class="nav-item"><a href="ordenes.html" class="nav-link"><i class="bi bi-file-earmark-text me-2"></i> Órdenes</a></li>
                <li class="nav-item"><a href="crear_ot.html" class="nav-link active"><i class="bi bi-plus-circle me-2"></i> Nueva Recepción</a></li>
                <li class="nav-item"><a href="crear_presupuesto.html" class="nav-link"><i class="bi bi-calculator me-2"></i> Nuevo Presupuesto</a></li>
                <li class="nav-item"><a href="mantenedor_base.html" class="nav-link"><i class="bi bi-database-gear me-2"></i> Base de Datos</a></li>
            </ul>
        </div>
        <div class="p-2 border-top border-secondary">
            <button class="btn btn-outline-danger btn-sm w-100" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión</button>
        </div>
    </div>

    <!-- Contenido Principal -->
    <div class="main-content">
        <h4 class="fw-bold mb-4"><i class="bi bi-plus-circle me-2 text-danger"></i>Nueva Recepción de Vehículo</h4>

        <div class="card card-custom p-4">
            <form id="formNuevaOT">
                <!-- CLIENTE Y VEHÍCULO -->
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label small text-secondary fw-bold">Nombre del Cliente *</label>
                        <input type="text" id="cliente" class="form-control" required placeholder="Ej: Juan Pérez">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label small text-secondary fw-bold">RUT / DNI</label>
                        <input type="text" id="rut" class="form-control" placeholder="12.345.678-9">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label small text-secondary fw-bold">Vehículo (Marca / Modelo) *</label>
                        <input type="text" id="vehiculo" class="form-control" required placeholder="Ej: Toyota Yaris 2018">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label small text-secondary fw-bold">Patente *</label>
                        <input type="text" id="patente" class="form-control text-uppercase" required placeholder="BBCL10">
                    </div>
                </div>

                <!-- DETALLES DE RECEPCIÓN -->
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-4">
                        <label class="form-label small text-secondary fw-bold">Kilometraje</label>
                        <input type="text" id="kilometraje" class="form-control" placeholder="120.000 KM">
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label small text-secondary fw-bold">Nivel de Combustible</label>
                        <select id="combustible" class="form-select">
                            <option value="1/4">1/4 Tanque</option>
                            <option value="1/2" selected>1/2 Tanque</option>
                            <option value="3/4">3/4 Tanque</option>
                            <option value="Lleno">Tanque Lleno</option>
                            <option value="Reserva">Reserva</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label small text-secondary fw-bold">Fecha de Ingreso</label>
                        <input type="date" id="fecha" class="form-control">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small text-secondary fw-bold">Observaciones / Motivo de Ingreso</label>
                    <textarea id="observaciones" class="form-control" rows="3" placeholder="Descripción de fallas o trabajos a realizar..."></textarea>
                </div>

                <!-- FOTOS DEL VEHÍCULO -->
                <div class="mb-4">
                    <label class="form-label small text-secondary fw-bold"><i class="bi bi-camera me-1"></i> Fotos del Vehículo (Subida directa a Supabase Storage)</label>
                    <input type="file" id="inputFotos" class="form-control" multiple accept="image/*">
                </div>

                <!-- ALERTA DE ESTADO -->
                <div id="alertaForm" class="alert alert-info d-none py-2 small mb-3"></div>

                <button type="submit" id="btnGuardarOT" class="btn btn-orange w-100 py-2">
                    <span id="btnTextOT"><i class="bi bi-floppy me-1"></i> Crear Orden de Trabajo</span>
                    <span id="btnSpinnerOT" class="spinner-border spinner-border-sm d-none" role="status"></span>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            if (typeof checkAuth === 'function') await checkAuth();
            document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('show');
        }

        document.getElementById('formNuevaOT').addEventListener('submit', async function(e) {
            e.preventDefault();

            const alerta = document.getElementById('alertaForm');
            const btnText = document.getElementById('btnTextOT');
            const btnSpinner = document.getElementById('btnSpinnerOT');
            const btn = document.getElementById('btnGuardarOT');
            const inputFotos = document.getElementById('inputFotos');

            alerta.classList.remove('d-none', 'alert-danger', 'alert-success');
            alerta.classList.add('alert-info');
            alerta.innerText = 'Subiendo imágenes y creando la orden...';
            
            btnText.innerText = 'Procesando...';
            btnSpinner.classList.remove('d-none');
            btn.disabled = true;

            try {
                const db = initSupabase();
                if (!db) throw new Error("Sin conexión a Supabase.");

                // 1. Subir fotos a Storage
                const urlsFotos = [];
                if (inputFotos.files.length > 0) {
                    for (let i = 0; i < inputFotos.files.length; i++) {
                        const url = await subirFotoSupabase(inputFotos.files[i]);
                        urlsFotos.push(url);
                    }
                }

                // 2. Insertar en la base de datos
                const folio = 'OT-' + Math.floor(1000 + Math.random() * 9000);
                const payload = {
                    numero: folio,
                    cliente: document.getElementById('cliente').value,
                    rut: document.getElementById('rut').value,
                    vehiculo: document.getElementById('vehiculo').value,
                    patente: document.getElementById('patente').value.toUpperCase(),
                    kilometraje: document.getElementById('kilometraje').value,
                    combustible: document.getElementById('combustible').value,
                    fecha: document.getElementById('fecha').value,
                    observaciones: document.getElementById('observaciones').value,
                    fotos: urlsFotos,
                    estado: 'Recepción',
                    items: [],
                    total: 0
                };

                const { data, error } = await db.from('ordenes_trabajo').insert([payload]);
                if (error) throw error;

                alerta.classList.replace('alert-info', 'alert-success');
                alerta.innerText = '¡Orden de trabajo creada con éxito!';
                
                setTimeout(() => {
                    window.location.href = 'ordenes.html';
                }, 1200);

            } catch (err) {
                alerta.classList.replace('alert-info', 'alert-danger');
                alerta.innerText = err.message || 'Error al guardar la orden.';
                btnText.innerHTML = '<i class="bi bi-floppy me-1"></i> Crear Orden de Trabajo';
                btnSpinner.classList.add('d-none');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
