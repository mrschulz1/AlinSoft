<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Alineaciones Bustamante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
        .card-login { background-color: #0f172a; border: 1px solid #334155; border-radius: 12px; }
        .btn-orange { background-color: #ff5722; color: #fff; font-weight: 600; }
        .btn-orange:hover { background-color: #e64a19; color: #fff; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

<div class="card card-login p-4 shadow-lg" style="max-width: 400px; width: 100%;">
    <div class="card-body text-center">
        <div class="mb-4">
            <i class="bi bi-gear-wide-connected text-danger fs-1"></i>
            <h3 class="fw-bold mt-2">Alin<span class="text-danger">Soft</span></h3>
            <p class="text-secondary small">Gestión Integral de Órdenes y Presupuestos</p>
        </div>
        <form id="loginForm">
            <div class="mb-3 text-start">
                <label class="form-label small text-secondary">Correo Electrónico</label>
                <input type="email" id="email" class="form-control" required placeholder="tu@correo.com">
            </div>
            <div class="mb-3 text-start">
                <label class="form-label small text-secondary">Contraseña</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            <div id="loginError" class="alert alert-danger d-none py-2 small" role="alert"></div>
            <button type="submit" id="btnLogin" class="btn btn-orange w-100 py-2 mt-2">
                <span id="btnText">Ingresar al Sistema</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
        </form>
    </div>
</div>

<!-- LIBRERÍAS Y CONFIGURACIÓN DE SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        // Si el usuario ya está autenticado en Supabase, enviarlo directamente al Dashboard
        if (typeof checkAuth === 'function') {
            await checkAuth();
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const alertError = document.getElementById('loginError');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const btn = document.getElementById('btnLogin');

        // Reset estado de UI
        alertError.classList.add('d-none');
        btnText.innerText = 'Autenticando...';
        btnSpinner.classList.remove('d-none');
        btn.disabled = true;

        try {
            const db = initSupabase();
            if (!db) throw new Error("No se pudo inicializar la conexión con Supabase.");

            // Autenticación oficial de Supabase
            const { data, error } = await db.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                throw error;
            }

            // Si la autenticación es exitosa, la sesión se guarda automáticamente en el SDK
            window.location.href = 'dashboard.html';

        } catch (err) {
            alertError.innerText = err.message || 'Error al iniciar sesión. Revisa tus credenciales.';
            alertError.classList.remove('d-none');
            
            btnText.innerText = 'Ingresar al Sistema';
            btnSpinner.classList.add('d-none');
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
